<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Colours the phone browser's address bar to match the app. -->
    <meta name="theme-color" content="#FFF5F5" />
    <meta name="description" content="Design your own nail set and save it as a picture." />
    <!-- The Nunito font (regular, semibold, bold), loaded in the background so a slow
         connection never holds up the app: media="print" makes the browser fetch it without
         waiting, and onload switches it on. Until then (or if it can't load), the system
         font is used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <title>Nail Designer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
